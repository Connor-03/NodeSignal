# CI: syntax, conventions and tests on every push and pull request, plus the
# two installers built and exercised against tests/mock-node.js.
# NodeSignal has no npm dependencies, so there is no install step; the only
# packages fetched are postject (by npx) and, for the Windows executable's
# version resource and icon, resedit with pe-library (by npm), all pinned and
# all at build time only.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: node --check every .js file
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::does not parse"; status=1; }
          done < <(git ls-files '*.js')
          exit $status

      - name: node --check the inline scripts of every .html file
        run: |
          cat > "$RUNNER_TEMP/html-scripts.js" <<'JS'
          const fs = require("fs"), path = require("path"), cp = require("child_process");
          const files = cp.execFileSync("git", ["ls-files", "*.html"]).toString().split("\n").filter(Boolean);
          let bad = 0, n = 0;
          for (const f of files) {
            const html = fs.readFileSync(f, "utf8");
            const re = /<script(?![^>]*\bsrc=)([^>]*)>([\s\S]*?)<\/script>/gi;
            let m;
            while ((m = re.exec(html))) {
              const type = (m[1].match(/type=["']?([^"'\s>]+)/i) || [])[1] || "";
              if (type && !/^(text\/javascript|module)$/i.test(type)) continue;
              const out = path.join(process.env.RUNNER_TEMP, `inline-${n++}${type === "module" ? ".mjs" : ".js"}`);
              fs.writeFileSync(out, m[2]);
              if (cp.spawnSync(process.execPath, ["--check", out], { stdio: "inherit" }).status !== 0) {
                console.log(`::error file=${f}::an inline <script> does not parse`);
                bad++;
              }
            }
          }
          console.log(`${n} inline script(s) checked in ${files.length} file(s)`);
          process.exit(bad ? 1 : 0);
          JS
          node "$RUNNER_TEMP/html-scripts.js"

      - name: No em dashes (U+2014) outside tests/vectors
        run: |
          EM="$(printf '\342\200\224')"
          if git grep -n -I -F -e "$EM" -- . ':(exclude)tests/vectors'; then
            echo "::error::em dash (U+2014) found; use a comma, colon or parentheses (CLAUDE.md section 7)"
            exit 1
          fi

      - name: Shell scripts parse
        run: |
          bash -n install-node.sh
          bash -n packaging/deb/build-deb.sh
          for s in preinst postinst prerm postrm; do sh -n "packaging/deb/$s"; done

      - name: .bat files keep CRLF line endings
        run: |
          status=0
          for f in $(git ls-files '*.bat'); do
            node -e '
              const f = process.argv[1], t = require("fs").readFileSync(f, "latin1");
              if (/(^|[^\r])\n/.test(t)) { console.log(`::error file=${f}::must use CRLF line endings`); process.exit(1); }' "$f" || status=1
          done
          exit $status

      - name: Every listed program file exists
        run: node setup-core.js --check-files .

      - name: Tests (every tests/*.test.js)
        run: node tests/run-all.js

  deb:
    name: Linux .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: bash packaging/deb/build-deb.sh "$(node -p 'require("./package.json").version')" "${{ matrix.arch }}"

      - name: Inspect
        run: |
          dpkg-deb -I "dist/nodesignal-linux-${{ matrix.arch }}.deb"
          dpkg-deb -c "dist/nodesignal-linux-${{ matrix.arch }}.deb"

      - name: Refuses to install without a Bitcoin node
        if: matrix.arch == 'amd64'
        run: |
          if sudo dpkg -i dist/nodesignal-linux-amd64.deb; then
            echo "::error::the package installed on a machine with no Bitcoin node"; exit 1
          fi
          sudo dpkg --purge nodesignal >/dev/null 2>&1 || true

      - name: Install, run under systemd against the mock node, purge
        if: matrix.arch == 'amd64'
        run: |
          # a fake node: its own user, a data directory and a bitcoin.conf the
          # mock reads rpcauth / rpcwhitelist from, like bitcoind (at start only)
          sudo useradd --system --create-home --home-dir /home/bitcoin bitcoin
          sudo -u bitcoin mkdir -p /home/bitcoin/.bitcoin/blocks
          printf 'server=1\nrpcport=18332\n' | sudo -u bitcoin tee /home/bitcoin/.bitcoin/bitcoin.conf >/dev/null
          sudo chmod 600 /home/bitcoin/.bitcoin/bitcoin.conf
          sudo cp -p /home/bitcoin/.bitcoin/bitcoin.conf "$RUNNER_TEMP/bitcoin.conf.orig"
          echo '__cookie__:never-used' | sudo -u bitcoin tee /home/bitcoin/.bitcoin/.cookie >/dev/null
          start_mock() {
            sudo nohup "$(command -v node)" tests/mock-node.js --conf /home/bitcoin/.bitcoin/bitcoin.conf --no-p2p >> "$RUNNER_TEMP/mock.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/mock.pid"
            sleep 1
          }
          start_mock

          sudo dpkg -i dist/nodesignal-linux-amd64.deb | tee "$RUNNER_TEMP/install.log"
          grep -q 'Restart your Bitcoin node' "$RUNNER_TEMP/install.log"
          nodesignal version

          # the dedicated user, never root and never the node's user
          id nodesignal
          test "$(systemctl show nodesignal -p User --value)" = nodesignal
          pid="$(systemctl show nodesignal -p MainPID --value)"
          test "$(ps -o user= -p "$pid")" = nodesignal
          sudo test "$(sudo stat -c %U:%a /etc/nodesignal/config.json)" = nodesignal:600
          # rpcauth + whitelist in bitcoin.conf, the password only in the config
          sudo grep -q '^rpcauth=nodesignal:[0-9a-f]*\$[0-9a-f]\{64\}$' /home/bitcoin/.bitcoin/bitcoin.conf
          sudo grep -qx 'rpcwhitelist=nodesignal:getblockchaininfo,getnetworkinfo,getpeerinfo' /home/bitcoin/.bitcoin/bitcoin.conf
          pass="$(sudo /opt/nodesignal/node -p 'require("/etc/nodesignal/config.json")["rpc-pass"]')"
          if sudo grep -qF "$pass" /home/bitcoin/.bitcoin/bitcoin.conf; then echo "::error::password in bitcoin.conf"; exit 1; fi
          if sudo grep -q cookie /etc/nodesignal/config.json; then echo "::error::config refers to the cookie"; exit 1; fi

          # "restart bitcoind", as the installer asked; NodeSignal reconnects by itself
          sudo kill "$(cat "$RUNNER_TEMP/mock.pid")"; sleep 1
          start_mock
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8789/health | grep -q '"rpcConnected":true'; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8789/health | node -e '
            let d = ""; process.stdin.on("data", (c) => (d += c)).on("end", () => {
              const h = JSON.parse(d);
              if (!h.rpcConnected) { console.error("RPC not connected:", d); process.exit(1); }
              console.log("health ok:", h.peerCount, "peers");
            });' || { sudo journalctl -u nodesignal -n 80 --no-pager; cat "$RUNNER_TEMP/mock.log"; exit 1; }
          nodesignal status
          systemctl show nodesignal -p User -p ProtectSystem -p ProtectHome -p NoNewPrivileges

          sudo dpkg --purge nodesignal
          test ! -e /etc/nodesignal
          sudo cmp /home/bitcoin/.bitcoin/bitcoin.conf "$RUNNER_TEMP/bitcoin.conf.orig"   # purge removed exactly our lines
          sudo test -f /var/lib/nodesignal/state.json   # state survives a purge
          sudo kill "$(cat "$RUNNER_TEMP/mock.pid")" || true

  windows:
    name: Windows .exe (build and selftest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build NodeSignal-Setup-windows-x64.exe
        run: node packaging/build-sea.js

      - name: package.json version
        id: pkg
        shell: pwsh
        run: Write-Output "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: Version resource and icon
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          $exe = '.\dist\NodeSignal-Setup-windows-x64.exe'
          $v = $env:EXPECTED_VERSION
          $i = (Get-Item $exe).VersionInfo
          $i | Format-List ProductName, ProductVersion, FileVersion, FileDescription, CompanyName, LegalCopyright, OriginalFilename, InternalName, Comments
          $bad = 0
          if ($i.ProductName -ne 'NodeSignal') { Write-Output "::error::ProductName is '$($i.ProductName)', expected 'NodeSignal'"; $bad = 1 }
          if ($i.ProductVersion -ne $v) { Write-Output "::error::ProductVersion is '$($i.ProductVersion)', expected '$v'"; $bad = 1 }
          if ($i.FileVersion -ne $v) { Write-Output "::error::FileVersion is '$($i.FileVersion)', expected '$v'"; $bad = 1 }
          if ($i.OriginalFilename -ne 'NodeSignal-Setup-windows-x64.exe') { Write-Output "::error::OriginalFilename is '$($i.OriginalFilename)'"; $bad = 1 }
          # the icon Explorer shows is ours (Core orange), not Node's (green)
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path).ToBitmap()
          $orange = 0
          for ($x = 0; $x -lt $bmp.Width; $x++) { for ($y = 0; $y -lt $bmp.Height; $y++) {
            $c = $bmp.GetPixel($x, $y)
            if ($c.A -gt 200 -and [Math]::Abs($c.R - 0xf7) -lt 24 -and [Math]::Abs($c.G - 0x93) -lt 24 -and [Math]::Abs($c.B - 0x1a) -lt 24) { $orange++ }
          } }
          Write-Output "icon $($bmp.Width)x$($bmp.Height), $orange Core-orange pixels"
          if ($orange -lt ($bmp.Width * $bmp.Height * 0.05)) { Write-Output "::error::the executable's icon is not the NodeSignal icon"; $bad = 1 }
          exit $bad

      - name: Selftest against the mock node
        shell: pwsh
        run: |
          $mock = Start-Process -FilePath node -ArgumentList '-e', "require('./tests/mock-node.js').rpcServer()" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          & .\dist\NodeSignal-Setup-windows-x64.exe version
          & .\dist\NodeSignal-Setup-windows-x64.exe selftest --rpc-url http://127.0.0.1:18332 --rpc-user u --rpc-pass p
          $code = $LASTEXITCODE
          Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
          exit $code

  sea-linux:
    name: Single executable mechanics on Linux (selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and selftest
        run: |
          node packaging/build-sea.js --out dist/nodesignal-sea-linux-x64
          nohup node -e "require('./tests/mock-node.js').rpcServer()" > "$RUNNER_TEMP/mock.log" 2>&1 &
          sleep 1
          ./dist/nodesignal-sea-linux-x64 selftest --rpc-url http://127.0.0.1:18332 --rpc-user u --rpc-pass p
