# Release: build the three installers, check them, and attach them to the
# GitHub Release for the tag under stable names, so a website can link to
#   https://github.com/Connor-03/NodeSignal/releases/latest/download/<asset>
#
#   NodeSignal-Setup-windows-x64.exe
#   nodesignal-linux-amd64.deb
#   nodesignal-linux-arm64.deb
#   SHA256SUMS.txt
#
# Triggered by pushing a tag v* (for example v1.3.0), or by hand with a
# version. A run by hand is a DRY RUN unless "dry_run" is unticked: it builds,
# tests and checks everything, and uploads the release notes and checksums as
# an artifact, but creates no tag and no release. Unticked, the tag
# v<version> is created at the current commit if missing.
# Before publishing: the version must match package.json and the daemon's
# user agent, and CHANGELOG.md must have a "## <version>" section, which
# becomes the top of the release notes. See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (for example 1.3.0)'
        required: true
      dry_run:
        description: 'Dry run: build and check everything, publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="${INPUT_VERSION#v}"; else v="${REF_NAME#v}"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+~-][0-9A-Za-z.+~-]+)?$'; then
            echo "::error::not a version: '$v'"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "${{ inputs.dry_run }}" = "false" ]; then publish=true; else publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $v, publish: $publish"
      - name: The version agrees everywhere
        env:
          V: ${{ steps.v.outputs.version }}
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          status=0
          pkg="$(node -p 'require("./package.json").version')"
          [ "$pkg" = "$V" ] || { echo "::error::package.json says $pkg, releasing $V"; status=1; }
          ua="$(sed -n "s#^const UA = '/NodeSignal:\([0-9.]*\)/';#\1#p" nodesignald.js)"
          case "$V" in "$ua" | "$ua".*) ;; *) echo "::error::nodesignald.js user agent says $ua, releasing $V"; status=1 ;; esac
          head="$(grep -m1 -E "^## $(printf '%s' "$V" | sed 's/[.]/[.]/g')( |$)" CHANGELOG.md || true)"
          if [ -z "$head" ]; then echo "::error::CHANGELOG.md has no '## $V' section"; status=1
          elif printf '%s' "$head" | grep -qi 'not yet released'; then
            if [ "$PUBLISH" = "true" ]; then echo "::error::CHANGELOG.md still says '$head'; put the release date there first"; status=1
            else echo "::warning::CHANGELOG.md still says '$head' (fine for a dry run)"; fi
          fi
          exit $status

  tests:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every test suite
        run: node tests/run-all.js

  deb:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        # bundle the same Node 22 release the Windows build uses
        run: NODE_VERSION="$(node --version)" bash packaging/deb/build-deb.sh "${{ needs.version.outputs.version }}" "${{ matrix.arch }}"
      - name: Inspect
        run: dpkg-deb -I "dist/nodesignal-linux-${{ matrix.arch }}.deb" && dpkg-deb -c "dist/nodesignal-linux-${{ matrix.arch }}.deb"
      - name: Install test (amd64)
        if: matrix.arch == 'amd64'
        run: |
          sudo env NODESIGNAL_SKIP_NODE_CHECK=1 dpkg -i dist/nodesignal-linux-amd64.deb
          test "$(nodesignal version)" = "${{ needs.version.outputs.version }}"
          nodesignal status --wait 30
          sudo dpkg --purge nodesignal
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/nodesignal-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node packaging/build-sea.js --version "${{ needs.version.outputs.version }}"
      - name: Version resource and icon
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $exe = '.\dist\NodeSignal-Setup-windows-x64.exe'
          $v = $env:EXPECTED_VERSION
          $i = (Get-Item $exe).VersionInfo
          $i | Format-List ProductName, ProductVersion, FileVersion, FileDescription, CompanyName, LegalCopyright, OriginalFilename, InternalName, Comments
          $bad = 0
          if ($i.ProductName -ne 'NodeSignal') { Write-Output "::error::ProductName is '$($i.ProductName)', expected 'NodeSignal'"; $bad = 1 }
          if ($i.ProductVersion -ne $v) { Write-Output "::error::ProductVersion is '$($i.ProductVersion)', expected '$v'"; $bad = 1 }
          if ($i.FileVersion -ne $v) { Write-Output "::error::FileVersion is '$($i.FileVersion)', expected '$v'"; $bad = 1 }
          if ($i.OriginalFilename -ne 'NodeSignal-Setup-windows-x64.exe') { Write-Output "::error::OriginalFilename is '$($i.OriginalFilename)'"; $bad = 1 }
          # the icon Explorer shows is ours (Core orange), not Node's (green)
          Add-Type -AssemblyName System.Drawing
          $bmp = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path).ToBitmap()
          $orange = 0
          for ($x = 0; $x -lt $bmp.Width; $x++) { for ($y = 0; $y -lt $bmp.Height; $y++) {
            $c = $bmp.GetPixel($x, $y)
            if ($c.A -gt 200 -and [Math]::Abs($c.R - 0xf7) -lt 24 -and [Math]::Abs($c.G - 0x93) -lt 24 -and [Math]::Abs($c.B - 0x1a) -lt 24) { $orange++ }
          } }
          Write-Output "icon $($bmp.Width)x$($bmp.Height), $orange Core-orange pixels"
          if ($orange -lt ($bmp.Width * $bmp.Height * 0.05)) { Write-Output "::error::the executable's icon is not the NodeSignal icon"; $bad = 1 }
          exit $bad
      - name: Selftest against the mock node
        shell: pwsh
        run: |
          $mock = Start-Process -FilePath node -ArgumentList '-e', "require('./tests/mock-node.js').rpcServer()" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          & .\dist\NodeSignal-Setup-windows-x64.exe selftest --rpc-url http://127.0.0.1:18332 --rpc-user u --rpc-pass p
          $code = $LASTEXITCODE
          Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/NodeSignal-Setup-windows-x64.exe
          if-no-files-found: error

  publish:
    needs: [version, tests, deb, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          for f in NodeSignal-Setup-windows-x64.exe nodesignal-linux-amd64.deb nodesignal-linux-arm64.deb; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum NodeSignal-Setup-windows-x64.exe nodesignal-linux-amd64.deb nodesignal-linux-arm64.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # this version's CHANGELOG section, without its own heading
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 && (length($0) == length(v) + 3 || substr($0, length(v) + 4, 1) == " ") { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' src/CHANGELOG.md > changes.md
          test -s changes.md || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }
          cat > notes.md <<NOTES
          NodeSignal $VERSION

          NodeSignal requires a Bitcoin node (Bitcoin Core or Bitcoin Knots) on the same machine. The installers refuse to continue without one. Restart your node once after installing so it reads NodeSignal's new RPC login.

          | Download | For |
          |---|---|
          | NodeSignal-Setup-windows-x64.exe | Windows 10 or 11, 64-bit. Double-click it normally; it refuses to run as administrator and needs no admin rights. |
          | nodesignal-linux-amd64.deb | Ubuntu, Debian and other 64-bit PCs. |
          | nodesignal-linux-arm64.deb | Raspberry Pi OS 64-bit and other arm64 boards. |

          Each installer includes its own Node.js runtime, so nothing else needs installing.

          **These binaries are not code-signed.** Windows SmartScreen will warn that the app is unrecognised ("Windows protected your PC"). Check the file's SHA-256 against SHA256SUMS.txt before choosing More info, then Run anyway.

          Verify a download:

          - Linux, in the download folder: \`sha256sum -c SHA256SUMS.txt --ignore-missing\`
          - Windows PowerShell: \`Get-FileHash .\NodeSignal-Setup-windows-x64.exe -Algorithm SHA256\`

          SHA256SUMS.txt is published with the files, so it catches a damaged or swapped download but cannot prove the release itself is genuine.

          Built by GitHub Actions from commit $GITHUB_SHA: $RUN_URL

          Install guides: WindowsInstallGuide.txt and LinuxInstallGuide.txt in the repository.

          ## What changed
          NOTES
          cat changes.md >> notes.md
          cat notes.md
      - name: Keep the notes and checksums (dry runs too)
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            notes.md
            dist/SHA256SUMS.txt
      - name: Dry run, nothing published
        if: needs.version.outputs.publish != 'true'
        run: echo "::notice::Dry run for $TAG. Built, tested and checked; no tag and no release were created. Notes and checksums are in the release-notes artifact."
      - name: Create or update the release
        if: needs.version.outputs.publish == 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            pre=""
            case "$VERSION" in *-*) pre="--prerelease" ;; esac   # releases/latest skips pre-releases
            gh release create "$TAG" --target "$GITHUB_SHA" --title "NodeSignal $VERSION" --notes-file notes.md $pre
          fi
          gh release upload "$TAG" --clobber \
            dist/NodeSignal-Setup-windows-x64.exe \
            dist/nodesignal-linux-amd64.deb \
            dist/nodesignal-linux-arm64.deb \
            dist/SHA256SUMS.txt
